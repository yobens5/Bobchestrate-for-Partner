site_name: Enable Partner Bobchestrate Workshop
site_description: Hands-on workshop for building AI agents with IBM watsonx Orchestrate
site_author: Workshop Team
site_url: https://yobens5.github.io/Bobchestrate-for-Partner/

# Documentation directory
docs_dir: docs

# Repository
repo_name: Bobchestrate-for-Partner
repo_url: https://github.com/yobens5/Bobchestrate-for-Partner
edit_uri: edit/main/docs/

# Theme configuration
theme:
  name: material
  language: en
  custom_dir: overrides
  logo: Bobchestrate_Workshop_logo_new.png
  favicon: Bobchestrate_Workshop_logo_new.png
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# Navigation structure
nav:
  - Home: index.md
  - Prerequisites:
      - Overview: part0-prerequisites/README.md
  - Part 1 - Setup:
      - Overview: part1-setup/README.md
  - Part 2 - Bob Custom Rules:
      - Overview: part2b-bob-custom-rules/README.md
  - Part 3 - First Agent:
      - Overview: part2-first-agent/README.md
      - Exercises: part2-first-agent/exercises.md
  - Part 4 - Custom Tools:
      - Overview: part3-custom-tools/README.md
      - Exercises: part3-custom-tools/exercises.md
  - Part 5 - Knowledge:
      - Overview: part4-knowledge/README.md
  - Part 6 - Guidelines & Guardrails:
      - Overview: part5-guidelines-guardrails/README.md
  - Part 7 - Agent Evaluations:
      - Overview: part6-agent-evaluation/README.md
      - Exercises: part6-agent-evaluation/exercises.md
  - Part 8 - Deployment:
      - Overview: part7-deployment/README.md
  - Part 9 - NL2SQL Accelerator:
      - Overview: part9-nl2sql/README.md
  - Part 10 - Multi-Agent Orchestration (Optional):
      - Overview: part8-multi-agent-orchestration/README.md
  - MCP Servers (Optional):
      - Overview: part10-mcp-servers/README.md
  - Agentic Workflows (Optional):
      - Overview: part11-agentic-workflows/README.md
      - Exercises: part11-agentic-workflows/exercises.md
  - AI Gateway Models (Optional):
      - Overview: part12-ai-gateway-models/README.md
      - Model Selection Guide: part12-ai-gateway-models/model-selection-guide.md
  - Bob Prompts:
      - Helpful Prompts: bob-prompts/helpful-prompts.md

# Plugins
plugins:
  - search
  - glightbox

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yobens5/Bobchestrate-for-Partner

# Made with Bob
